<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOP | WIC</title>
    <link rel="stylesheet" href="style.css">
    
    <link href="FOOTAGE/favicon.png" rel="icon" type="image/png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,400..700;1,400..700&family=Doto:wght@100..900&display=swap" rel="stylesheet">

    <style>
        /* Standalone CSS for the Shop Page */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            background-color: #ffffff;
            color: #000000;
            font-family: "helvetica neue", sans-serif;         
            font-weight: thin;   
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .shop-status {
            font-family: "helvetica neue", sans-serif;
            font-size: 50px;
            font-weight: normal;
            color: rgb(0, 13, 255); /* Pure Blue */
            text-transform: uppercase;
            letter-spacing: -0.05em;
            line-height: 1;
            margin-bottom: 20px;
        }

        /* The flashing computer cursor */
        .blinking-cursor {
            color: #000;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .sub-text {
            font-size: 1.5rem;
            font-weight: lighter;
            margin-bottom: 50px;
            max-width: 600px;
            padding: 0 20px;
            line-height: 1.4;
        }

        /* Group for the buttons */
        .button-group {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap; /* Allows stacking on very small screens */
            z-index: 10;
        }

        /* Brutalist Buttons */
        .back-btn, .gallery-btn {
            font-family: "helvetica neue", sans-serif;
            font-size: 1.2rem;
            font-weight: 900;
            color: rgb(0, 8, 255); /* WIC Blue */
            text-decoration: none;
            border: 3px solid rgb(0, 8, 255);
            padding: 15px 30px;
            text-transform: uppercase;
            transition: all 0.2s ease;
        }

        .back-btn:hover, .gallery-btn:hover {
            background-color:#ffea00;
            color: rgb(0, 8, 255); /* WIC Blue */
        }

        /* Bottom Marquee */
        .marquee-container {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #000;
            color: #fff;
            height: 40px;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .scrolling-text {
            white-space: nowrap;
            display: inline-block;
            animation: scroll-left 15s linear infinite;
            font-family: "Doto", sans-serif;
            font-size: 1rem;
            padding-left: 100%;
        }

        @keyframes scroll-left {
            100% { transform: translateX(-100%); }
        }

        /* Mobile Adjustments */
@media (max-width: 768px) {

    .shop-status {
        font-size: 25px; /* Slightly smaller fixed size */
        padding: 0 px; /* Walls on the left and right */
        width: 100%;
        word-break: break-word; /* Forces long words to break instead of overflowing */
    }

    .sub-text {
        font-size: 10px;
        margin-bottom: 40px;
    }

    .button-group {
        gap: 10px;
    }

    .back-btn, .gallery-btn {
        font-size: 1rem;
        padding: 10px 20px;
    }
}
/* Small Screen Detector for Shop Page */
@media (max-height: 380px) {
    body {
        height: 100vh;
        width: 100vw;
        background: url('FOOTAGE/smallscreendetector.jpg') center center / contain no-repeat white !important;
    }
  
    /* Hide all the shop page elements so only the image shows */
    header,
    .header-background-color,
    .shop-status,
    .sub-text,
    .button-group,
    .marquee-container {
        display: none !important;
    }
}
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="header-link">
            <img src="FOOTAGE/logo.png" alt="Seungyu Jung Jeon Logo" class="header-logo">
        </a>    
    </header>
    <div class="header-background-color"></div>   

    <h1 class="shop-status">WIC is currently prioritising <br> <b><i>HAND 2 HAND</i></b> service<span class="blinking-cursor">!</span></h1>
    
    <p class="sub-text">online shop coming soon, or maybe not. haha.</p>

    <div class="button-group">
        <a href="index.html" class="back-btn">GO HOME</a>
    </div>

    <div class="marquee-container"> 
        <div class="scrolling-text">
            <span>SHOP UNAVAILABLE. NO TRANSACTIONS PENDING. SYSTEM OFFLINE. // SHOP UNAVAILABLE. NO TRANSACTIONS PENDING. SYSTEM OFFLINE.</span>
        </div>
    </div>

</body>
</html>
